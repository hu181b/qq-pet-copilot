name: Build portable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.3)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested GUI dependencies
        run: python -m pip install -r requirements.txt -c build-constraints.txt
      - name: Fetch bundled resources
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/fetch_ocr_models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fetch_scrcpy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fetch_minitouch.py --arch arm64-v8a armeabi-v7a
      - name: Two offline test rounds
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          foreach ($round in 1,2) {
            $env:TEST_WIDTH = if ($round -eq 1) { '1080' } else { '720' }
            foreach ($suite in 'test_full_regression','test_profiles','test_school_navigation','test_window_behavior','test_review_regression','test_profile_dialog','test_runner_shutdown','test_moneybag','test_recommendation_scope') {
              python "tools/$suite.py"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Build self-contained EXE
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/write_version.py --tag '${{ inputs.tag }}' --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm QQPetCopilot.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py --tag '${{ inputs.tag }}' --output dist/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ inputs.tag }}
          path: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
      - name: Create draft release without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ inputs.tag }}' 'dist/release/QQPetCopilot-${{ inputs.tag }}-windows-x64.zip' 'dist/release/SHA256SUMS.txt' --verify-tag --draft --title '${{ inputs.tag }}' --notes-file 'RELEASE-${{ inputs.tag }}.md'
